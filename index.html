<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ian & Cherry | Wedding Invitation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="floating-flowers">
    <span>🌻</span>
    <span>🌼</span>
    <span>🌻</span>
    <span>🌼</span>
    <span>🌻</span>
    <span>🌼</span>
</div>

<!-- =================== -->
<!-- INTRO SCREEN -->
<!-- =================== -->

<div id="intro">

    <div class="overlay"></div>

    <div class="introContent">

        <p class="welcome">
            Together with our families
        </p>

        <h1>
            Ian <span>&</span> Cherry
        </h1>

        <p class="inviteText">

            joyfully invite you to celebrate
            our wedding

        </p>

        <p class="date">

            December 21, 2026

        </p>

        <button id="enterBtn">

            Open Invitation

        </button>

        <p class="musicHint">

            🎵 Turn your volume on

        </p>

    </div>

</div>

<!-- Background Music -->

<audio id="bgMusic" loop>

    <source src="music/tayong-dalawa.mp3" type="audio/mpeg">

</audio>

<!-- =================== -->
<!-- HERO SECTION -->
<!-- =================== -->

<section class="reveal">

    <img src="images/hero.png" alt="Hero">

</section>

<!-- OUR STORY -->

<section class="reveal">

    <img src="images/our-story.png" alt="Our Story">

</section>

<section class="reveal">

    <img src="images/our-story-2.png" alt="Our Story">

</section>

<!-- SCHEDULE -->

<section class="reveal">

    <img src="images/Schedule.png" alt="Schedule">

</section>

<!-- CEREMONY -->

<section class="reveal">

    <img src="images/ceremony.png" alt="Ceremony">

</section>

<!-- DRESS CODE -->

<section class="reveal">

    <img src="images/dress-code.png" alt="Dress Code">

</section>

<!-- QUESTIONS -->

<section class="reveal">

    <img src="images/questions.png" alt="Questions">

</section>

<section class="reveal">

    <img src="images/questions-2.png" alt="Questions">

</section>

<section class="reveal">

    <img src="images/questions-3.png" alt="Questions">

</section>


<!-- GIFT -->

<section class="reveal">

    <img src="images/gift-registry.png" alt="Gift Registry">

</section>

<!-- RSVP -->

<section id="rsvp" class="reveal">

    <img src="images/rsvp.png" alt="RSVP">

    <a
        class="rsvpButton"
        href="https://docs.google.com/forms/d/e/1FAIpQLSf-Vhw8f2Pokqd1BoKGq3ELGMQvI33CCyvimEM9kWRjwJiWQQ/viewform"
        target="_blank">

        RSVP NOW

    </a>

</section>

<!-- CONTACT -->

<section class="reveal">

    <img src="images/contact-us.png" alt="Contact">

</section>

<script src="script.js"></script>

</body>
</html>
